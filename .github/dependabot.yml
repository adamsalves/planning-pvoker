version: 2

# NOTA: nenhum bloco define `target-branch`. Isso é intencional.
# O Dependabot só aplica esta configuração aos *security updates* (agrupamento,
# prefixo de commit, limites) quando `target-branch` está ausente — e security
# updates sempre miram a branch default do repositório, independentemente do que
# for configurado aqui. Como o fluxo do projeto é feature -> develop -> main
# (ver RELEASE.md), PRs do Dependabot nascem em `main` e precisam ser refeitos
# na `develop` à mão — a menos que a branch default do repositório mude para
# `develop`, o que faria todos eles já nascerem no lugar certo.

updates:
  # Cliente (Vue + Vite) — raiz do repositório
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      # Toolchain de lint: sobe junto ou não sobe. `eslint-plugin-oxlint` declara
      # peer `oxlint@~<mesma minor>` a partir da 1.76, então separar os dois
      # quebra o `npm ci` com ERESOLVE — foi o que derrubou o PR #100.
      #
      # Os nomes vão LITERAIS de propósito. Na 1ª execução desta config os
      # patterns com wildcard não capturaram nada: o grupo saiu com exatamente
      # `eslint`, `oxlint` e `prettier` (os literais), enquanto
      # `eslint-plugin-oxlint`, `eslint-plugin-vue` e `eslint-config-prettier`
      # — diretas e casando `eslint-*` — caíram no grupo minor/patch. Não
      # determinei a causa; listar cada pacote não depende dela.
      client-linting:
        patterns:
          - eslint
          - eslint-config-prettier
          - eslint-plugin-oxlint
          - eslint-plugin-vue
          - '@vue/eslint-config-typescript'
          - oxlint
          - prettier
      client-testing:
        patterns:
          - vitest
          - '@vitest/*'
          - '@vue/test-utils'
          - '@playwright/test'
          - jsdom
      # Segunda camada: mesmo que o grupo acima falhe em capturar algo, o
      # toolchain de lint não pode ser absorvido aqui — senão volta a se
      # separar do par que precisa acompanhar.
      client-minor-patch:
        exclude-patterns:
          - eslint
          - eslint-config-prettier
          - eslint-plugin-oxlint
          - eslint-plugin-vue
          - '@vue/eslint-config-typescript'
          - oxlint
          - prettier
        update-types:
          - minor
          - patch

  # Servidor (Express + Socket.IO) — deployado isolado no Render
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      # Só o que o servidor realmente tem: nem `tsx` nem pacotes `@vitest/*`
      # são dependências diretas daqui (o runner é `ts-node` + `nodemon`).
      server-testing:
        patterns:
          - vitest
          - ts-node
          - nodemon
      # `typescript` fica FORA de qualquer grupo de propósito: é o compilador que
      # gera o `dist/` publicado no Render, então um major dele merece PR próprio
      # e revisão do JS emitido (foi o que fizemos no #96).
      server-minor-patch:
        exclude-patterns:
          - typescript
        update-types:
          - minor
          - patch

  # Actions dos workflows de CI e release
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        patterns:
          - '*'
